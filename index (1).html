<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Floating Rhythm</title>
<style>
:root{--ink:#12384a;--sage:#547768;--paper:#f7f4eb;--cream:#fffdf7;--gold:#d6ac65;--line:#d8d6cc;--night:#213f58;--mist:#e9f0e7}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font:16px/1.45 Georgia,serif;background:linear-gradient(110deg,#f8f5e9 0%,#f1ead7 48%,#e5eaf0 100%)}
button,textarea{font:inherit;color:inherit}.hero{padding:32px clamp(20px,5vw,64px);background:linear-gradient(105deg,#eef1df 0%,#ffe1a9 42%,#7891a8 70%,#213d5c 100%);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;inset:auto 0 0;height:34%;background:linear-gradient(165deg,transparent 15%,rgba(65,98,81,.32) 16% 21%,transparent 22%),linear-gradient(195deg,transparent 28%,rgba(36,72,69,.4) 29% 36%,transparent 37%);opacity:.65}.hero-row{position:relative;z-index:1;display:grid;grid-template-columns:1.2fr .8fr .8fr;gap:24px;align-items:center}.brand h1{font-size:clamp(42px,6vw,78px);font-weight:500;margin:0}.brand em{font-size:24px}.brand p{font-family:system-ui,sans-serif;max-width:360px}.cycle{text-align:center;background:rgba(255,255,255,.48);border:1px solid rgba(255,255,255,.7);border-radius:50%;aspect-ratio:1;display:grid;place-content:center;padding:24px}.cycle strong{font-size:21px}.night{text-align:center;color:#fff}.night .moon{font-size:46px}.wrap{max-width:1500px;margin:auto;padding:26px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}.animal-pill{border:1px solid #bfc9c0;background:#faf8f0;border-radius:999px;padding:8px 13px;cursor:pointer}.animal-pill.active{background:var(--sage);color:white;border-color:var(--sage)}.week{display:grid;grid-template-columns:repeat(7,minmax(190px,1fr));gap:14px;overflow-x:auto;padding-bottom:8px}.day{min-width:190px;background:rgba(255,253,247,.92);border:1px solid var(--line);border-radius:20px;padding:17px;box-shadow:0 8px 25px rgba(32,50,45,.06);display:flex;flex-direction:column;min-height:510px}.day .dow{font:700 12px/1.2 system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#60746d}.day h2{font-size:28px;margin:8px 0 0}.element{color:#8b6d35;margin:0 0 6px}.principle{font-style:italic;min-height:48px}.practice{width:100%;text-align:left;border:1px solid #d8d2c4;background:#fffdf8;border-radius:12px;padding:11px;margin:5px 0;cursor:pointer}.practice:hover,.practice.active{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}.notes-label{font:700 12px system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;margin:18px 0 6px}.notes{margin-top:auto;resize:vertical;min-height:92px;border:1px solid #d8d2c4;border-radius:12px;background:#faf8f0;padding:10px}.record{margin-top:24px;background:var(--night);color:#fff;border-radius:24px;padding:24px}.record h3{font-size:31px;margin:4px 0}.record small{font:700 12px system-ui,sans-serif;letter-spacing:.15em;color:#e8cf9c}.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}.field{border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:15px;background:rgba(255,255,255,.05)}.field b{display:block;color:#f1cf86;font:700 12px system-ui,sans-serif;letter-spacing:.07em;margin-bottom:8px}.hint{opacity:.78}.tai-library{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}.tai-library strong{display:block;color:#fff;margin:0 0 10px}.field p,.field li{line-height:1.55}.field ol{padding-left:20px;margin-bottom:0}@media(max-width:700px){.tai-library{grid-template-columns:1fr}}.foot{text-align:center;padding:25px;font-style:italic}@media(max-width:900px){.hero-row{grid-template-columns:1fr}.cycle{max-width:260px;margin:auto}.night{text-align:left}.fields{grid-template-columns:1fr 1fr}}@media(max-width:520px){.fields{grid-template-columns:1fr}.wrap{padding:15px}}
</style>
</head>
<body>
<header class="hero"><div class="hero-row"><div class="brand"><h1>Floating Rhythm</h1><em>Your body knows the way.</em><p>A living practice calendar organized by animal, movement, rest, and return.</p></div><div class="cycle"><strong>16 Animals<br>One Rhythm<br>A Fuller You</strong></div><div class="night"><div class="moon">☾</div><strong>DAY · NIGHT · RETURN</strong><p><em>Harmony is not a fixed state,<br>but a living rhythm.</em></p></div></div></header>
<main class="wrap"><div class="toolbar" id="animals" aria-label="16 animal cycle"></div><section class="week" id="week"></section><section class="record" id="record" aria-live="polite"></section></main><footer class="foot">Move well · Live fully · Return often</footer>
<script>
const animals=[
 {n:'Tiger',e:'Wood',p:'Root · gather · release'}, {n:'Deer',e:'Water',p:'Listen · soften · flow'}, {n:'Bear',e:'Earth',p:'Settle · support · carry'}, {n:'Monkey',e:'Fire',p:'Adapt · spark · redirect'}, {n:'Crane',e:'Metal',p:'Clarity · balance · grace'},
 {n:'Dragon',e:'Wood',p:'Spiral · rise · transform'}, {n:'Shark',e:'Water',p:'Sense · track · continue'}, {n:'Snake',e:'Earth',p:'Coil · extend · gather'}, {n:'Mantis',e:'Metal',p:'Attend · intercept · connect'}, {n:'Horse',e:'Fire',p:'Open · travel · sustain'}, {n:'Lion',e:'Wood',p:'Gather · spring · settle'}, {n:'Eagle',e:'Metal',p:'Expand · focus · descend'}, {n:'Owl',e:'Water',p:'Turn · perceive · return'}, {n:'Unicorn',e:'Fire',p:'Unify · refine · express'}, {n:'Rooster',e:'Earth',p:'Rise · align · announce'}, {n:'Turtle',e:'Water',p:'Protect · conserve · endure'}
];
const practices=['Tai Chi Chuan','Qi Gong','Hsing-I','BaGua Zhang'];
const days=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
let start=0, selectedPractice='Tai Chi Chuan', selectedAnimal='Tiger';
const movementData={
'Tiger|Tai Chi Chuan': `<div class="tai-library">
  <div class="field"><b>EMBRACE TIGER, RETURN TO MOUNTAIN</b><strong>Quality: Yang emerging from Yin</strong><p><b>STANCE</b> Diagonal bow stance, with the body oriented toward the corner.</p><p><b>FEET & WEIGHT</b> Step the right foot toward the diagonal. Settle progressively into the forward leg while maintaining connection through the rear leg.</p><p><b>ARM POSITIONS</b> As the waist turns, separate the arms. The right arm follows the waist's rotation while the left hand subsequently expresses forward.</p><p><b>HAND SHAPE / ORIENTATION</b> Palms remain open and relaxed rather than forming Tiger Claws or Tiger Mouth.</p><p><b>BODY ALIGNMENT</b> Keep the crown lifted, torso upright, shoulders released, and movement organized through the waist turn.</p><p><b>GAZE</b> Let the gaze accompany the body's diagonal orientation and waist turn.</p><p><b>DISTINCTIVE QUALITY</b> Embrace power without becoming hard.</p></div>
  <div class="field"><b>ROLL BACK</b><strong>Quality: Yin</strong><p><b>STANCE</b> Maintain the established base while permitting the center to receive and turn rather than drive forward.</p><p><b>FEET & WEIGHT</b> Shift without collapsing into either leg.</p><p><b>ARM POSITIONS</b> Keep the arms rounded and connected to the torso as the body turns.</p><p><b>HAND SHAPE / ORIENTATION</b> Open, relaxed palms.</p><p><b>BODY ALIGNMENT</b> Turn through the waist while maintaining upright structure.</p><p><b>GAZE</b> Follow the direction established by the turning center.</p><p><b>DISTINCTIVE QUALITY</b> Receive rather than oppose.</p></div>
  <div class="field"><b>PRESS</b><strong>Quality: Yin becoming Yang</strong><p><b>STANCE</b> Stable bow stance.</p><p><b>FEET & WEIGHT</b> Weight settles toward the forward leg while connection remains through the rear foot.</p><p><b>ARM POSITIONS</b> Maintain rounded arms and bring the action toward the front of the body's center.</p><p><b>HAND SHAPE / ORIENTATION</b> Relaxed hands without Tiger-specific clawing.</p><p><b>BODY ALIGNMENT</b> Upright and integrated, avoiding an independent reach of the shoulders.</p><p><b>GAZE</b> Forward along the direction of the posture.</p><p><b>DISTINCTIVE QUALITY</b> Contained expansion.</p></div>
  <div class="field"><b>PUSH</b><strong>Quality: Yang returning toward Yin</strong><p><b>STANCE</b> Remain rooted within the bow stance.</p><p><b>FEET & WEIGHT</b> Maintain controlled forward settling rather than leaning the torso.</p><p><b>ARM POSITIONS</b> Both arms express forward while remaining connected to the body.</p><p><b>HAND SHAPE / ORIENTATION</b> Open palms.</p><p><b>BODY ALIGNMENT</b> Vertical spine, released shoulders, movement arising from the coordinated lower and upper body.</p><p><b>GAZE</b> Forward.</p><p><b>DISTINCTIVE QUALITY</b> Power expressed without rigidity.</p></div>
</div>`,
'Tiger|Qi Gong': `<div class="fields"><div class="field"><b>STARTING POSITION</b><p>Stand with the feet approximately shoulder-width apart and parallel. Keep the knees softly bent, spine upright, shoulders lowered, and arms relaxed at the sides. Spread the fingers, then curl them into defined Tiger Claws.</p></div><div class="field"><b>EXACT MOVEMENT SEQUENCE</b><ol><li><strong>Raise the Tiger.</strong> Form both hands into Tiger Claws. Draw the hands upward, extending them above the head while keeping the body upright. Re-form the hands and draw the arms downward with controlled strength.</li><li><strong>Tiger Pounce.</strong> Sink through the legs. Bring the hands upward and forward, then extend into the pounce with Tiger Claws reaching through the fingertips. Allow the torso to fold and unfold as one continuous wave.</li><li><strong>Claw and Stretch.</strong> Gather toward center. Extend through the claws and limbs, emphasizing the long muscular and spinal quality of the Tiger.</li><li><strong>Return.</strong> Draw the movement inward, soften the Tiger Claws, settle the weight evenly, and return to an upright centered position.</li></ol></div><div class="field"><b>ENDING POSITION</b><p>Feet grounded and parallel, knees soft, spine upright, arms relaxed, weight centered.</p></div></div>`,
'Tiger|Hsing-I': `<div class="fields"><div class="field"><b>STARTING POSITION</b><ol><li>Settle into a compact stance with one foot forward.</li><li>Keep the knees flexed and the kua released downward.</li><li>Lengthen the spine without stiffening the torso.</li><li>Relax and settle the shoulders.</li><li>Bring both arms inward so the middle of the body is closed and protected.</li><li>Shape both hands into the Tiger Mouth position, keeping the two hands coordinated as one action.</li></ol></div><div class="field"><b>EXACT MOVEMENT SEQUENCE</b><ol><li><strong>Contract.</strong> Gather through the legs, hips, spine, and arms without collapsing the chest.</li><li><strong>Rise.</strong> Begin rising from the gathered body. Allow the movement to travel from the lower body through the back and shoulders into the arms.</li><li><strong>Advance on the diagonal.</strong> Step diagonally forward. Establish the forward leg while the rear leg continues supporting the body's advancing force.</li><li><strong>Double-Palm Tiger Pounce.</strong> As the step and body arrive, send both palms outward together. Maintain Tiger Mouth. The legs, hips, spine, shoulders, and palms arrive as one coordinated action, outward and slightly upward.</li><li><strong>Issue.</strong> Complete the pounce with a short unified expression of whole-body power rather than arm strength.</li><li><strong>Regather.</strong> Draw both hands back toward the body's center. Soften through the shoulders, settle the kua, and contract again.</li><li><strong>Opposite-side Tiger.</strong> Advance diagonally with the opposite leg and repeat Contract → Rise → Advance → Double-Palm Pounce → Issue → Regather.</li></ol></div><div class="field"><b>ENDING POSITION</b><p>Complete the final pounce, then return to a compact connected stance: feet grounded, knees softly flexed, kua settled, spine lengthened, shoulders relaxed, hands gathered in Tiger Mouth structure, attention directed forward.</p></div></div>`,
'Tiger|BaGua Zhang': `<div class="fields"><div class="field"><b>STARTING POSITION</b><ol><li>Stand at the edge of an imagined circle.</li><li>Sink the weight gently through both legs without collapsing the knees inward.</li><li>Lengthen upward through the crown while allowing the hips and shoulders to settle.</li><li>Turn the torso toward the center of the circle.</li><li>Extend the inside palm toward the center at about chest height.</li><li>Keep the outside hand nearer the torso, ready to follow the body's rotation.</li><li>Fix the gaze toward the circle's center.</li></ol></div><div class="field"><b>EXACT MOVEMENT SEQUENCE</b><ol><li><strong>Begin the circle walk.</strong> Step along the circumference while the waist remains turned inward.</li><li><strong>Gather the Tiger.</strong> Draw the outside palm inward toward the ribs and slightly sink the weight while the inside palm remains oriented toward the circle.</li><li><strong>Turn and open.</strong> Rotate from the waist and back. The gathered palm travels forward as the other palm draws back. Continue stepping during the exchange.</li><li><strong>Tiger palm.</strong> Settle into the next step and express both palms through the turn: the forward palm projects outward while the rear palm supports near the centerline.</li><li><strong>Coil back into the circle.</strong> Withdraw the forward palm as the torso continues turning. Let the other palm come forward and resume the inward-facing circular posture.</li><li><strong>Continue around the circle.</strong> Walk several more steps, then repeat Gather → Turn → Tiger Palm → Coil on the opposite side.</li></ol></div><div class="field"><b>ENDING POSITION</b><p>Finish the final circle step with weight settled, knees softly flexed, spine lengthened, torso turned toward the center, inside palm extended, and outside palm gathered nearer the body.</p></div></div>`
};
function placeholder(animal,practice){
 if(practice==='Tai Chi Chuan') return `<p class="hint">Tai Chi Chuan will use the selected animal’s Yin/Yang posture library: Stance · Feet & Weight · Arm Positions · Hand Shape/Orientation · Body Alignment · Gaze · Distinctive Quality. Transitions remain yours to author.</p>`;
 return `<div class="fields"><div class="field"><b>STARTING POSITION</b><span class="hint">Authored ${animal} ${practice} record goes here.</span></div><div class="field"><b>EXACT MOVEMENT SEQUENCE</b><span class="hint">No generic fallback movement is inserted.</span></div><div class="field"><b>ENDING POSITION</b><span class="hint">Defined by the literal movement record.</span></div></div>`;
}
function renderRecord(){const a=animals.find(x=>x.n===selectedAnimal);const key=a.n+'|'+selectedPractice;document.querySelector('#record').innerHTML=`<small>PRACTICE RECORD</small><h3>${a.n} · ${selectedPractice}</h3><p>${a.p}${a.e?' · '+a.e:''}</p>${movementData[key]||placeholder(a.n,selectedPractice)}`}
function renderWeek(){const w=document.querySelector('#week');w.innerHTML='';days.forEach((d,i)=>{const a=animals[(start+i)%animals.length],card=document.createElement('article');card.className='day';card.innerHTML=`<div class="dow">${d}</div><h2>${a.n}</h2><p class="element">${a.e||'Expanded cycle'}</p><p class="principle">${a.p}</p><div>${practices.map(p=>`<button type="button" class="practice" data-a="${a.n}" data-p="${p}">${p}</button>`).join('')}</div><label class="notes-label" for="note-${i}">Notes</label><textarea class="notes" id="note-${i}" placeholder="Movement discoveries, transition ideas, observations…"></textarea>`;w.appendChild(card)});w.querySelectorAll('.practice').forEach(b=>b.addEventListener('click',()=>{selectedAnimal=b.dataset.a;selectedPractice=b.dataset.p;document.querySelectorAll('.practice').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderRecord();document.querySelector('#record').scrollIntoView({behavior:'smooth',block:'nearest'})}))}
function renderAnimals(){const x=document.querySelector('#animals');animals.forEach((a,i)=>{const b=document.createElement('button');b.type='button';b.className='animal-pill'+(i===0?' active':'');b.textContent=a.n+(a.e?' · '+a.e:'');b.addEventListener('click',()=>{start=i;selectedAnimal=a.n;x.querySelectorAll('button').forEach(y=>y.classList.remove('active'));b.classList.add('active');renderWeek();renderRecord()});x.appendChild(b)})}
renderAnimals();renderWeek();renderRecord();
</script>
</body></html>
