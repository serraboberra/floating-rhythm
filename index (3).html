</style></head><body><header class="hero"><div class="hero-row"><div class="brand"><h1>Floating Rhythm</h1><em>Your body knows the way.</em><p>A living practice calendar organized by animal, movement, rest, and return.</p></div><div class="cycle"><strong>16 Animals<br>One Rhythm<br>A Fuller You</strong></div><div class="night"><div class="moon">☾</div><strong>DAY · NIGHT · RETURN</strong><p><em>Harmony is not a fixed state,<br>but a living rhythm.</em></p></div></div></header><main class="wrap"><div class="toolbar" id="animals"></div><section class="week" id="week"></section><section class="record" id="record" aria-live="polite"></section></main><footer class="foot">Move well · Live fully · Return often</footer><script>
const D={"animals": [{"n": "Tiger", "e": "Wood", "p": "Root · gather · release"}, {"n": "Deer", "e": "Water", "p": "Listen · soften · flow"}, {"n": "Bear", "e": "Earth", "p": "Settle · support · carry"}, {"n": "Monkey", "e": "Fire", "p": "Adapt · spark · redirect"}, {"n": "Crane", "e": "Metal", "p": "Clarity · balance · grace"}, {"n": "Dragon", "e": "Wood", "p": "Spiral · rise · transform"}, {"n": "Shark", "e": "Water", "p": "Sense · track · continue"}, {"n": "Snake", "e": "Earth", "p": "Coil · extend · gather"}, {"n": "Mantis", "e": "Metal", "p": "Attend · intercept · connect"}, {"n": "Horse", "e": "Fire", "p": "Open · travel · sustain"}, {"n": "Lion", "e": "Wood", "p": "Gather · spring · settle"}, {"n": "Eagle", "e": "Metal", "p": "Expand · focus · descend"}, {"n": "Owl", "e": "Water", "p": "Turn · perceive · return"}, {"n": "Unicorn", "e": "Fire", "p": "Unify · refine · express"}, {"n": "Rooster", "e": "Earth", "p": "Rise · align · announce"}, {"n": "Turtle", "e": "Water", "p": "Protect · conserve · endure"}], "practices": ["Tai Chi Chuan", "Qi Gong", "Hsing-I", "BaGua Zhang"], "records": {"Tiger|Tai Chi Chuan": {"type": "tai", "items": [{"name": "Embrace Tiger, Return to Mountain", "q": "Yang emerging from Yin", "stance": "Diagonal bow stance, body oriented toward the corner.", "feet": "Step right to the diagonal; settle progressively forward while retaining the rear-foot connection.", "arms": "Separate the arms with the waist turn; right arm follows the turn while left hand expresses forward.", "hands": "Open, relaxed palms.", "align": "Crown lifted, torso upright, shoulders released; organize the shape through the waist.", "gaze": "Accompany the diagonal turn.", "quality": "Embrace power without becoming hard."}, {"name": "Roll Back", "q": "Yin", "stance": "Maintain the established base.", "feet": "Shift without collapsing into either leg.", "arms": "Rounded arms remain connected to the torso as the center turns.", "hands": "Open, relaxed palms.", "align": "Upright structure through the waist turn.", "gaze": "Follow the turning center.", "quality": "Receive rather than oppose."}, {"name": "Press", "q": "Yin becoming Yang", "stance": "Stable bow stance.", "feet": "Settle toward the forward leg while retaining rear-foot connection.", "arms": "Rounded arms collect toward the front of the center.", "hands": "Relaxed hands.", "align": "Upright and integrated; do not reach from the shoulders.", "gaze": "Forward.", "quality": "Contained expansion."}, {"name": "Push", "q": "Yang returning toward Yin", "stance": "Rooted bow stance.", "feet": "Controlled forward settling without leaning.", "arms": "Both arms express forward while connected to the torso.", "hands": "Open palms.", "align": "Vertical spine and released shoulders.", "gaze": "Forward.", "quality": "Power expressed without rigidity."}]}, "Tiger|Qi Gong": {"type": "three", "start": "Feet shoulder-width and parallel; knees soft, spine upright, shoulders lowered. Form defined Tiger Claws.", "seq": ["Raise the Tiger: draw the clawed hands upward above the head, then draw them down with controlled strength.", "Tiger Pounce: sink through the legs, bring the hands upward and forward, and extend into the pounce as the torso folds and unfolds in one wave.", "Claw and Stretch: gather toward center, then lengthen through claws, limbs and spine.", "Return: soften the claws and settle evenly into upright standing."], "end": "Feet grounded and parallel; knees soft, spine upright, arms relaxed, weight centered."}, "Tiger|Hsing-I": {"type": "three", "start": "Compact forward stance; knees flexed, kua released, spine long, shoulders settled; both hands in Tiger Mouth protecting the middle.", "seq": ["Contract through legs, hips, spine and arms without collapsing the chest.", "Rise from the gathered body, transmitting from the floor through back and shoulders.", "Advance diagonally, keeping rear-leg support.", "Double-Palm Tiger Pounce: both palms issue together, outward and slightly upward, with the step and body arriving as one.", "Regather to the center, settle the kua, then repeat on the opposite diagonal."], "end": "Compact connected stance; feet grounded, knees soft, kua settled, hands gathered in Tiger Mouth."}, "Tiger|BaGua Zhang": {"type": "three", "start": "Stand on an imagined circle; sink gently, lengthen the crown, turn the torso inward; inside palm extends toward center and outside hand stays near the torso.", "seq": ["Begin the circle walk along the circumference with the waist turned inward.", "Gather the Tiger: outside palm draws to the ribs as weight sinks slightly.", "Turn and open: waist and back rotate; gathered palm travels forward as the other draws back.", "Tiger Palm: settle and express the forward palm while rear palm supports the centerline.", "Coil back into the circle and resume walking; repeat on the opposite side."], "end": "Finish a circle step rooted and lengthened, torso toward center, inside palm extended and outside palm gathered."}, "Shark|Qi Gong": {"type": "three", "start": "Deep Water Wu Ji: feet under hips or slightly narrower, knees soft, pelvis neutral, spine long; feet pressurized while torso, ribs and shoulders dissolve; head floats slightly forward, gaze soft and wide, breath thin and continuous.", "seq": ["Body Wave: hinge softly at the knees and send a small wave ankles → sacrum → vertebrae → head; reverse it back to the ankles, continuously.", "Lateral Sensing: transfer fully left, then right, keeping the empty foot flat; develop the transfer into a continuous pendulum.", "Forward Pressure Walk: walk without rising out of density; pivot and return, then practice internally triggered changes of direction.", "Pectoral Rotation: arms at shoulder height, make synchronized figure-eights forward and reverse, then alternate the arms.", "Tail Fin Flick: free one side and initiate a small diagonal torque from the sacrum; let it travel through spine to opposite shoulder; alternate sides."], "end": "Return to dense neutral standing: feet pressurized, torso liquid, spine long, breath continuous, gaze wide."}, "Shark|BaGua Zhang": {"type": "three", "start": "Deep Water Entry: feet together, knees slightly bent; torso liquid, spine vertical; lead arm slightly forward, rear elbow by ribs, palms down at hip height; head slightly forward with soft wide gaze.", "seq": ["Enter the Current: Tail Fin Flick initiates the first circle step; each step is a lateral weight shift with the rear foot drawing level.", "Pivot: rear foot flick and sacrum torque redirect the body without breaking the lateral wave.", "Cutting Turn: rotate the body as one mass; lead arm sweeps outward while rear arm gathers; cross-step, circle the leg out, resume the wave.", "Cresting Rise: redirect the lateral wave vertically through the spine; rear arm threads upward, both hands rise, then return down the axis and resume the circle walk."], "end": "Re-enter the continuous circle walk with feet pressurized, torso liquid, palms low and the lateral wave restored."}, "Shark|Hsing-I": {"type": "three", "start": "San-ti-like compact stance adapted to Shark: lead foot forward, rear foot connected, knees soft; torso liquid but coherent; both palms low and forward like pectoral fins; head slightly forward, gaze wide.", "seq": ["Pressurize: settle through the feet without bracing the trunk.", "Wave-load: create a small ankle-to-sacrum-to-spine wave while maintaining forward intent.", "Advance: step straight through with no pause; rear foot follows to restore the base.", "Fin Split: lead palm drives forward while rear palm draws past the ribs, powered by sacral torque rather than shoulder reach.", "Tail Redirect: use a short diagonal sacrum flick to change the line, then immediately advance on the new line.", "Repeat left/right, keeping the pressure continuous rather than resetting between issues."], "end": "Settle in a compact forward stance, feet dense, spine long, shoulders dissolved, hands low and ready, breath continuous."}, "Shark|Tai Chi Chuan": {"type": "tai", "items": [{"name": "Commencement — Deep Water", "q": "Yin", "stance": "Parallel stance, feet under hips.", "feet": "Evenly weighted; knees soft.", "arms": "Arms float forward only as high as the shoulders can remain dissolved.", "hands": "Palms relaxed and slightly down.", "align": "Spine long, sacrum heavy, ribs unbraced.", "gaze": "Soft horizon gaze.", "quality": "Density without muscular heaviness."}, {"name": "Wave Hands Like Currents", "q": "Yin becoming Yang", "stance": "Comfortable side-to-side base.", "feet": "Transfer fully but smoothly from one leg to the other.", "arms": "Arms travel with the waist in broad horizontal arcs.", "hands": "Open palms, changing orientation with the turn.", "align": "Let lateral weight transfer move the torso; shoulders follow.", "gaze": "Wide and unfixed.", "quality": "Continuous lateral sensing."}, {"name": "Needle at Sea Bottom", "q": "Yin", "stance": "Narrowed stance with one leg substantially weighted.", "feet": "Sink into the supporting leg; empty the other without collapsing.", "arms": "One hand traces downward while the other supports near the center.", "hands": "Relaxed fingers, palm angled toward the floor.", "align": "Fold from the kua while keeping length through the spine.", "gaze": "Downward and forward without craning the neck.", "quality": "Descend into depth while retaining direction."}, {"name": "Fan Through the Back — Cresting Fin", "q": "Yang", "stance": "Forward bow stance.", "feet": "Front leg receives; rear foot remains connected.", "arms": "One arm rises as the other extends forward, opening the upper back.", "hands": "Open palms.", "align": "Lengthen through crown and upper back without lifting the ribs.", "gaze": "Forward beneath the raised arm.", "quality": "The submerged wave crests without losing its root."}]}, "Owl|Qi Gong": {"type": "three", "start": "Moonrise Wu Ji: feet shoulder-width, pelvis sinks a few millimeters into a perch; elbows float slightly outward; eyes open with deliberately widened peripheral vision.", "seq": ["Cervical Circles: slow, pain-free head circles with shoulders still; never force range.", "Ear Listening: receive the soundscape without naming it; turn and tilt the head slowly while listening, then reopen the eyes and combine auditory and visual periphery.", "Silent Step Training: walk slowly in a circle, placing each foot as quietly as possible with flexed knees.", "Wing Expansion: arms extend to full wingspan, rotate palms up, close forward until fingertips nearly meet, then expand again with the breath.", "Moonlight Gaze: gently incline the head upward within comfortable range; add broad wing expansion while keeping chest soft."], "end": "Return to Moonrise Wu Ji with a quiet perch, soft throat, wide visual field and silent breath."}, "Owl|BaGua Zhang": {"type": "three", "start": "Moonrise Standing: feet shoulder-width, weight even; chest soft, arms rounded at shoulder height as if holding the moon; gaze wide and receiving.", "seq": ["Silent Circle Walk: head glides first, body follows; lift each foot vertically and place it softly, transferring weight gradually while upper body remains quiet.", "Silent Pivot: with weight settled, orient the head first within comfortable range, then let rear foot and body follow; return to the circle.", "Silent Drop: descend as one upright unit without preparatory sway, gather both palms inward, then rise quietly back to stepping.", "Moon Gaze Palm: from low guard, one palm arcs upward as the other draws to the hip; alternate sides.", "Wing Wrap and Feather Float: open broadly, gather inward, then use a 45-degree body turn and soft arm redirection to preserve the Owl’s yielding quality.", "Night Vision Spiral: walk slowly with downcast gaze, relying on periphery and proprioception, then return to wide-field gaze."], "end": "Finish in Moonrise Standing: centered, silent, arms rounded, gaze wide and receptive."}, "Owl|Hsing-I": {"type": "three", "start": "Compact forward stance with knees soft and spine upright. Lead hand floats forward, rear hand protects the center; shoulders rounded and relaxed. Keep the gaze broad rather than fixed.", "seq": ["Perch: settle quietly into the rear leg while preserving forward intent.", "Listen and orient: turn the head gently toward the new line first, within a comfortable range; let torso and hips follow.", "Silent advance: place the lead foot softly, then let the rear foot follow without stamping.", "Wing issue: both forearms open from the center in a short spreading action powered by the step and back, not by lifting the shoulders.", "Gather: draw the hands inward toward the centerline as the legs compress.", "Repeat to the opposite angle: orient → silent step → short wing issue → gather; keep the breath quiet throughout."], "end": "Finish in a compact, balanced stance with shoulders soft, hands gathered, spine vertical and gaze broad."}, "Owl|Tai Chi Chuan": {"type": "tai", "items": [{"name": "Commencement — Moonrise", "q": "Yin", "stance": "Parallel shoulder-width stance.", "feet": "Evenly weighted with a shallow perch through the knees.", "arms": "Arms float up softly and remain rounded.", "hands": "Open relaxed palms.", "align": "Chest soft, crown lifted, pelvis settled.", "gaze": "Wide-field, unfixed gaze.", "quality": "Receive before moving."}, {"name": "White Crane Spreads Wings — Night Wing", "q": "Yang within Yin", "stance": "Narrow comfortable stance.", "feet": "Settle substantially into one leg while the other remains light.", "arms": "One arm rises while the other lowers, creating broad vertical separation.", "hands": "Open palms, wrists unforced.", "align": "Torso upright, shoulders released, elbows alive rather than locked.", "gaze": "Wide and quiet.", "quality": "Expand without announcing the expansion."}, {"name": "Repulse Monkey — Listening Retreat", "q": "Yin", "stance": "Stable stepping base.", "feet": "Shift backward smoothly before placing the retreating foot.", "arms": "One palm withdraws as the other expresses forward, coordinated by the waist.", "hands": "Open palms.", "align": "Remain upright as the center moves back.", "gaze": "Peripheral, not hard-focused.", "quality": "Yield space without losing awareness."}, {"name": "Golden Rooster Stands on One Leg — Perch", "q": "Yang emerging", "stance": "Single-leg balance with the supporting knee soft.", "feet": "Weight settles fully into the supporting leg; lifted foot stays relaxed.", "arms": "One arm rises while the opposite arm settles.", "hands": "Open hands, fingers relaxed.", "align": "Crown up, kua settled, torso vertical.", "gaze": "Level and broad.", "quality": "Stillness that remains ready to turn."}]}, "Deer|Tai Chi Chuan": {"type": "tai", "items": [{"name": "Commencement", "q": "Yin", "stance": "Parallel shoulder-width stance with the feet pointing forward.", "feet": "Begin evenly weighted through both feet. Soften the knees and settle the pelvis without squatting.", "arms": "Let both arms float forward to about shoulder height with rounded elbows, then lower them in front of the torso.", "hands": "Open palms face downward as the arms rise and remain relaxed as they descend; fingers are naturally separated.", "align": "Crown lifted, chin gently drawn in, chest relaxed, spine vertical and shoulders released.", "gaze": "Rest the gaze forward at eye level, broad and unforced.", "quality": "Listen and soften so the shape can change without becoming vague. Quietly establish upright alignment, even weight and unbroken breath."}, {"name": "Brush Knee and Twist Step", "q": "Yang", "stance": "Forward bow stance with the front knee tracking over the toes and the rear leg extended but not locked.", "feet": "Step forward with an empty heel, place the whole foot, then shift weight gradually forward while the rear foot remains rooted.", "arms": "The hand on the stepping side brushes downward past the knee and finishes beside the hip; the opposite hand circles near the ear and expresses forward at chest height.", "hands": "Brushing hand angles down beside the thigh. Forward hand is an open palm facing outward, wrist straight and elbow softly bent.", "align": "Keep the torso upright. Coordinate the forward shift, waist turn and two arms as one action; do not lean into the front knee.", "gaze": "Follow the forward palm and settle the eyes beyond its fingertips.", "quality": "Listen and soften so the shape can change without becoming vague. Rooted forward expression grows from a soft weight transfer and coordinated waist turn."}, {"name": "Cloud Hands", "q": "Yin", "stance": "Upright side-stepping stance with the feet kept roughly parallel.", "feet": "Shift fully from one leg to the other before the empty foot steps sideways; keep the body at an even height.", "arms": "One rounded forearm passes in front of the face while the other circles below the chest; the arms exchange levels as the waist turns.", "hands": "Open palms rotate naturally with the waist: the upper palm turns inward across the face while the lower palm turns inward toward the body.", "align": "Spine remains vertical and shoulders stay dropped. The waist carries the arms; avoid sweeping them independently.", "gaze": "Track the upper hand briefly while maintaining peripheral awareness of the direction of travel.", "quality": "Listen and soften so the shape can change without becoming vague. Continuous lateral change with no break between full and empty."}, {"name": "Single Whip", "q": "Yang", "stance": "Wide forward bow stance oriented toward the open-palm side.", "feet": "Set the heel of the stepping foot, place the sole, then shift forward while the rear leg stays connected and the rear foot remains grounded.", "arms": "One arm extends laterally with a hooked hand while the opposite arm opens forward at shoulder height with a rounded elbow.", "hands": "Rear hand forms a relaxed hook with fingertips gathered downward; forward hand is open, palm outward and fingers upright.", "align": "Turn through the waist while keeping the torso upright, chest relaxed and shoulders level.", "gaze": "Settle the gaze beyond the open forward palm.", "quality": "Listen and soften so the shape can change without becoming vague. Expand in two directions from a stable center."}]}, "Bear|Tai Chi Chuan": {"type": "tai", "items": [{"name": "Commencement", "q": "Yin", "stance": "Parallel shoulder-width stance with the feet pointing forward.", "feet": "Begin evenly weighted through both feet. Soften the knees and settle the pelvis without squatting.", "arms": "Let both arms float forward to about shoulder height with rounded elbows, then lower them in front of the torso.", "hands": "Open palms face downward as the arms rise and remain relaxed as they descend; fingers are naturally separated.", "align": "Crown lifted, chin gently drawn in, chest relaxed, spine vertical and shoulders released.", "gaze": "Rest the gaze forward at eye level, broad and unforced.", "quality": "Settle mass into the legs and let the upper body remain supported. Quietly establish upright alignment, even weight and unbroken breath."}, {"name": "Ward Off", "q": "Yang", "stance": "Forward bow stance with the torso square enough to maintain a rounded front structure.", "feet": "Shift into the front leg without losing pressure through the rear foot; keep both knees aligned with their toes.", "arms": "Front forearm forms a rounded arc before the chest while the rear hand supports near the ribs or inside forearm.", "hands": "Front palm turns inward; supporting palm remains open and relaxed.", "align": "Maintain a buoyant curve from back through elbow to wrist. Do not lift the shoulder or collapse the chest.", "gaze": "Look forward over the rounded front forearm.", "quality": "Settle mass into the legs and let the upper body remain supported. Support outward pressure without stiffness."}, {"name": "Press", "q": "Yang", "stance": "Stable forward bow stance.", "feet": "Settle toward the front leg while maintaining a continuous line of support through the rear foot.", "arms": "One rounded forearm stays before the chest while the opposite palm contacts or approaches the inside of that forearm.", "hands": "Supporting palm faces inward toward the front forearm; both wrists remain straight and relaxed.", "align": "Keep the spine vertical and elbows dropped. Let legs and waist carry the joined arm shape forward.", "gaze": "Look forward over the joined hands.", "quality": "Settle mass into the legs and let the upper body remain supported. Concentrate whole-body expansion into a compact forward shape."}, {"name": "Push", "q": "Yang returning", "stance": "Forward bow stance with the hips centered between the feet.", "feet": "Shift back enough to empty the front leg slightly, then settle forward again without lifting the toes or leaning.", "arms": "Both hands draw inward toward the ribs and then extend forward together with rounded elbows.", "hands": "Open palms face outward at chest height; fingers point upward and wrists remain relaxed.", "align": "Torso stays upright as the legs create the forward action. Keep shoulders dropped and elbows softly bent.", "gaze": "Look forward between and beyond the palms.", "quality": "Settle mass into the legs and let the upper body remain supported. Express forward power while preserving softness in the joints."}]}, "Monkey|Tai Chi Chuan": {"type": "tai", "items": [{"name": "Commencement", "q": "Yin", "stance": "Parallel shoulder-width stance with the feet pointing forward.", "feet": "Begin evenly weighted through both feet. Soften the knees and settle the pelvis without squatting.", "arms": "Let both arms float forward to about shoulder height with rounded elbows, then lower them in front of the torso.", "hands": "Open palms face downward as the arms rise and remain relaxed as they descend; fingers are naturally separated.", "align": "Crown lifted, chin gently drawn in, chest relaxed, spine vertical and shoulders released.", "gaze": "Rest the gaze forward at eye level, broad and unforced.", "quality": "Stay agile and ready to redirect without losing the center. Quietly establish upright alignment, even weight and unbroken breath."}, {"name": "Repulse Monkey", "q": "Yin", "stance": "Narrow retreating stance with one foot placed behind along a comfortable line.", "feet": "Shift into the standing leg, step the empty foot backward toe-first or softly through the ball, then transfer weight without leaning.", "arms": "One hand withdraws past the ear as the opposite palm extends forward; the hands exchange as the retreating step settles.", "hands": "Forward palm faces outward at chest height. Withdrawing palm stays open and passes beside the ear without raising the shoulder.", "align": "Keep the torso vertical and let the waist coordinate the retreating step and palm exchange.", "gaze": "Remain oriented forward, following the expressing palm rather than looking backward.", "quality": "Stay agile and ready to redirect without losing the center. Yield ground while preserving forward awareness and structure."}, {"name": "Cloud Hands", "q": "Yin/Yang", "stance": "Upright side-stepping stance with the feet kept roughly parallel.", "feet": "Shift fully from one leg to the other before the empty foot steps sideways; keep the body at an even height.", "arms": "One rounded forearm passes in front of the face while the other circles below the chest; the arms exchange levels as the waist turns.", "hands": "Open palms rotate naturally with the waist: the upper palm turns inward across the face while the lower palm turns inward toward the body.", "align": "Spine remains vertical and shoulders stay dropped. The waist carries the arms; avoid sweeping them independently.", "gaze": "Track the upper hand briefly while maintaining peripheral awareness of the direction of travel.", "quality": "Stay agile and ready to redirect without losing the center. Continuous lateral change with no break between full and t, draw it toward the shoulder, return the foot, and repeat on the opposite diagonal without rushing."], "end": "Return to a compact parallel stance, open both hands, lower the arms, and let the knees and breath settle."}, "Crane|Qi Gong": {"type": "three", "start": "Stand upright with feet together or comfortably close, knees unlocked and arms relaxed. Lengthen the crown and soften the chest.", "seq": ["Crane Stretches Upward: rise gently through the legs as both arms arc out and upward; keep shoulders down and wrists relaxed.", "Lower the arms through the sides while bending the knees slightly, returning the heels and weight fully to the floor.", "Crane Spreads Wings: shift fully into the left leg, lift the right knee to a comfortable height, and open both arms laterally with soft elbows.", "Lower the foot silently as the wings gather; repeat on the other side, then complete one slow bilateral wing opening and closing."], "end": "Stand tall on both feet with weight even, arms at the sides, chin level, and breath unforced."}, "Dragon|Qi Gong": {"type": "three", "start": "Stand shoulder-width with knees soft. Hold one palm near the lower abdomen and the other before the chest, elbows rounded.", "seq": ["Coil left from the feet through the waist and ribs; the lower palm spirals upward while the upper palm sinks along the centerline.", "Step to the left diagonal and continue the spiral until the rising palm reaches eye level and the sinking palm reaches the opposite hip.", "Unwind through center without straightening the knees; exchange the palms.", "Repeat to the right diagonal, keeping both spirals continuous and the head carried by the turning spine."], "end": "Return to parallel standing with both palms rounded before the lower abdomen and the spine vertical."}, "Snake|Qi Gong": {"type": "three", "start": "Stand in a narrow parallel stance with knees soft, elbows close, and fingertips extended forward at lower-rib height.", "seq": ["Coil the waist left while drawing the left hand to the ribs and threading the right fingertips forward along a narrow line.", "Shift into the left leg and let the thread lengthen from rear foot through spine to fingertips without locking the elbow.", "Recoil the right hand as the torso returns through center.", "Repeat to the right, alternating coil, thread, and recoil while the head stays level."], "end": "Finish narrow and upright with both hands softly extended before the center and weight even."}, "Mantis|Qi Gong": {"type": "three", "start": "Stand compactly with one foot slightly forward, knees soft, elbows bent, and forearms protecting the center. Form relaxed Mantis hooks without gripping.", "seq": ["Settle into the rear leg and draw the lead hook inward across the centerline.", "Step a short angle with the lead foot while the rear forearm extends forward beneath the gathering hook.", "Place the foot quietly, withdraw both arms to compact guard, and keep the shoulders released.", "Repeat to the opposite angle, making each hook, step, and extension small and exact."], "end": "Return to a compact neutral stance, release the hooks, and rest both hands before the lower ribs."}, "Horse|Qi Gong": {"type": "three", "start": "Stand parallel with knees elastic and hands resting near the lower ribs. Keep the chest open without arching the back.", "seq": ["Sink through both feet and lengthen the spine.", "Step forward heel-to-toe and transfer weight smoothly through the whole foot.", "As the body advances, open both arms from the center to a broad rounded span, palms forward and slightly outward.", "Gather the arms as the rear foot follows; continue for four sustained steps, then turn and return without breaking the rhythm."], "end": "Stand evenly weighted with feet parallel, hands relaxed by the ribs, and breathing settled."}, "Lion|Qi Gong": {"type": "three", "start": "Take a broad parallel stance with knees soft and palms facing inward before the chest.", "seq": ["Gather by sinking and drawing both elbows toward the ribs while the palms turn downward.", "Shift to the left diagonal and open both forearms outward from the center, stopping before the elbows lock.", "Recoil through the waist, gather again, and turn to the right diagonal.", "Repeat the open-and-gather action on both diagonals, allowing the legs and back to create the spring."], "end": "Return to the broad center stance, lower the arms, and settle weight equally through both feet."}, "Eagle|Qi Gong": {"type": "three", "start": "Stand tall with the left foot slightly forward and both arms softly open at lower-chest height.", "seq": ["Lengthen through the crown and widen across the upper back as both arms spread to wingspan.", "Shift forward and draw the elbows inward, crossing the forearms lightly before the chest.", "Open one arm on a downward diagonal while the opposite arm rises and extends, keeping both shoulders down.", "Gather to center and repeat with the diagonals reversed."], "end": "Finish upright with gaze level, arms relaxed, and weight balanced between both feet."}, "Unicorn|Qi Gong": {"type": "three", "start": "Stand centered with feet parallel and palms rounded before the lower abdomen, fingertips nearly meeting.", "seq": ["Gather both palms inward while sinking softly through the legs.", "Rise through the legs as the palms spiral upward along the centerline, one slightly ahead of the other.", "At chest height, open the forearms into a balanced diagonal without lifting the shoulders.", "Settle as the palms return to the lower center; repeat with the leading palm exchanged."], "end": "Return centered with both hands relaxed before the lower abdomen and weight even."}, "Rooster|Qi Gong": {"type": "three", "start": "Stand upright with feet comfortably close, knees unlocked, and hands near the lower ribs.", "seq": ["Shift fully into the left leg and lift the right knee to a comfortable height.", "Raise the left forearm before the chest while the right hand settles beside the hip; keep the pelvis level.", "Lower the right foot silently and return the hands through center.", "Repeat on the opposite side, then complete two alternating balances at an even breath pace."], "end": "Stand evenly weighted with spine vertical, hands lowered, and gaze level."}, "Turtle|Qi Gong": {"type": "three", "start": "Stand shoulder-width with knees soft. Round both arms before the ribs as though enclosing a shell; keep the chest relaxed rather than collapsed.", "seq": ["Sink slightly and widen across the back while drawing the elbows forward and inward.", "Shift weight toward the rear of both feet without leaning; palms turn inward to protect the center.", "Return to mid-foot and rotate the waist left, carrying the rounded shell as one unit.", "Rotate right, then return to center and slowly release the arms downward."], "end": "Return to neutral standing with weight centered, shoulders soft, spine long, and breath calm."}, "Deer|Hsing-I": {"type": "three", "start": "Begin in a compact san-ti-like stance, left foot forward, rear heel connected, knees flexed. Hands form soft Deer-Antler shapes: lead hand at chest height, rear hand near the ribs.", "seq": ["Gather into the rear leg while keeping the crown lifted and elbows dropped.", "Step to the left forward diagonal, placing the heel and whole foot without widening the stance excessively.", "As the step lands, the lead antler hand opens outward at chest height while the rear forearm protects the center.", "Bring the rear foot forward into a following step, regather, and repeat on the right diagonal with the hands exchanged."], "end": "Finish in a compact forward stance with the lead antler hand extended, rear hand guarding, hips settled, and spine upright."}, "Bear|Hsing-I": {"type": "three", "start": "Begin in san-ti with feet on a narrow track, rear leg loaded, both hands open before the torso, elbows heavy and upper back broad.", "seq": ["Sink through the rear foot and expand the upper back without rounding the waist.", "Step forward and slightly inward; drive the body as one mass from the rear leg.", "Lift both forearms in a short rounded arc, palms inward, as the upper back supplies the issuing force.", "Follow with the rear foot, settle immediately, lower the forearms to guard, and repeat with the opposite foot leading."], "end": "Finish rooted in a compact stance with forearms rounded before the chest, shoulders settled, and weight supported by both legs."}, "Monkey|Hsing-I": {"type": "three", "start": "Take a low compact stance with one foot forward, rear heel connected, elbows close and hands lightly hooked near the ribs.", "seq": ["Compress into the rear leg and lower the center without folding the chest.", "Leap or step quickly to a forward diagonal within a safe distance, landing softly on a bent lead leg.", "Extend the lead palm toward shoulder height while the rear hand protects the ribs.", "Withdraw the lead foot and palm together, immediately redirect to the opposite diagonal, and repeat without pausing upright."], "end": "Finish compact and alert with both hands guarding the center and knees springy."}, "Crane|Hsing-I": {"type": "three", "start": "Begin in a narrow san-ti-like stance with one foot forward, hands open along the centerline and shoulders released.", "seq": ["Settle fully into the rear leg and gather both elbows toward the ribs.", "Advance lightly as the lead forearm rises along the center and the rear palm descends beside the hip.", "Bring the rear foot forward in a quiet follow-step while preserving the vertical split of the arms.", "Regather, change sides, and repeat with the opposite arm rising and opposite leg advancing."], "end": "Finish upright in a narrow connected stance with one hand high, one low, knees soft, and gaze forward."}, "Dragon|Hsing-I": {"type": "three", "start": "Begin in san-ti with the lead palm forward, rear hand near the ribs, knees flexed and waist slightly coiled toward the rear leg.", "seq": ["Compress into the rear leg and twist the waist inward, drawing both elbows toward the center.", "Step diagonally forward and unwind from rear foot through waist and spine.", "Drill the lead palm upward and forward while the rear hand pulls to the ribs, maintaining a narrow central line.", "Follow-step, sink, recoil into the opposite coil, and repeat on the other diagonal."], "end": "Finish in a diagonal forward stance with lead palm drilled forward, rear hand gathered, spine lengthened, and hips settled."}, "Snake|Hsing-I": {"type": "three", "start": "Begin in a narrow san-ti stance with lead fingertips forward at solar-plexus height and rear hand guarding the ribs.", "seq": ["Coil the waist and draw the lead elbow toward the body as weight gathers into the rear leg.", "Advance straight along a narrow track and thread the lead forearm forward, palm angled inward.", "Let the rear foot follow as the rear hand slides beneath or beside the lead arm to protect the center.", "Recoil both hands to guard, change lead, and repeat with continuous winding power."], "end": "Finish in a narrow forward stance with one forearm threaded out, the other guarding, knees soft, and shoulders down."}, "Mantis|Hsing-I": {"type": "three", "start": "Begin in compact san-ti, lead hand shaped as a relaxed hook at chest height, rear palm near the sternum, elbows close.", "seq": ["Gather into the rear leg and draw the lead hook inward across the centerline.", "Step sharply to a short diagonal and use the hook to pull toward the lead hip.", "At the same instant, issue the rear forearm or palm straight forward from the body center.", "Follow-step, withdraw both hands to guard, switch lead, and repeat on the other diagonal."], "end": "Finish compactly with lead hook forward, rear hand guarding, spine upright, and weight connected through both feet."}, "Horse|Hsing-I": {"type": "three", "start": "Begin in a forward san-ti stance with hands protecting the center and the rear leg strongly connected to the floor.", "seq": ["Gather briefly into the rear leg without rocking the torso backward.", "Drive forward in a long committed step, placing the heel and sole on a straight track.", "Issue both palms forward together at chest height as the rear leg, waist and back arrive behind the hands.", "Bring the rear foot forward in a quick follow-step, regather without stopping, and repeat for three advances."], "end": "Finish in a forward connected stance with both palms extended, rear heel engaged, shoulders down, and gaze ahead."}, "Lion|Hsing-I": {"type": "three", "start": "Begin in a broad compact stance with one foot forward, both forearms crossed lightly before the chest and upper back expanded.", "seq": ["Compress through both legs and draw the crossed forearms toward the ribs.", "Advance diagonally with a powerful but controlled step.", "Open both forearms outward from the center as the body arrives, palms forward and elbows slightly bent.", "Follow-step, settle, cross the forearms again, and repeat toward the opposite diagonal."], "end": "Finish broad and rooted with forearms opened before the torso, knees flexed, and spine tall."}, "Eagle|Hsing-I": {"type": "three", "start": "Begin in san-ti with the lead hand forward, rear hand near the elbow, fingers curved naturally as if preparing to grasp.", "seq": ["Gather both elbows toward the ribs and load the rear leg.", "Advance as both hands rise slightly and close toward the centerline.", "Use the step and back to split both forearms downward and outward in a short seizing action, keeping wrists aligned.", "Follow-step into guard, change lead, and repeat the rise-gather-split action on the opposite side."], "end": "Finish in a forward stance with hands separated on downward diagonals, shoulders released, and weight connected."}, "Unicorn|Hsing-I": {"type": "three", "start": "Begin in a compact upright stance with one foot forward, lead palm low on the centerline and rear palm near the ribs.", "seq": ["Gather into the rear leg and draw both palms toward the lower center.", "Advance straight while spiraling the lead forearm upward along the centerline.", "As the lead palm reaches face height, the rear palm presses downward near the hip to stabilize the vertical opposition.", "Follow-step, regather, exchange leads, and repeat with the opposite palm rising."], "end": "Finish upright with one palm spiraled upward, the other anchored low, hips settled, and gaze forward."}, "Rooster|Hsing-I": {"type": "three", "start": "Begin in a narrow san-ti stance with one foot forward, lead hand at chest height and rear hand guarding the ribs.", "seq": ["Settle fully into the rear leg and gather both elbows close.", "Lift the lead knee and advance with a knee-led step, placing the foot softly on a straight track.", "Issue the opposite palm forward as the lead-side hand withdraws to the ribs.", "Follow-step, settle immediately, then repeat with the other knee and hand leading."], "end": "Finish in a narrow connected stance with one palm forward, rear hand guarding, spine vertical, and knees springy."}, "Turtle|Hsing-I": {"type": "three", "start": "Begin in san-ti with both forearms rounded before the ribs, palms inward, upper back broad and chest soft.", "seq": ["Receive into the rear leg while expanding the back and drawing the elbows inward to protect the center.", "Step forward on a short line without lifting the body.", "Issue both forearms forward together in a compact rounded press powered by the rear foot and back.", "Follow-step, absorb the arms back into the shell, change lead, and repeat."], "end": "Finish in a compact protective stance with rounded forearms, settled hips, upright spine, and centered weight."}, "Deer|BaGua Zhang": {"type": "three", "start": "Stand on the circle in a narrow walking stance. Turn the torso toward center; inside hand forms Deer Antler at chest height, outside palm rests near the ribs.", "seq": ["Walk four quiet mud steps, placing each foot flat and transferring weight only after the sole settles.", "On the fifth step, gather the outside palm to the ribs and turn the waist farther toward center.", "Deer Antler Change: hook the inside antler hand outward as the outside palm threads beneath it; perform an inside扣 step, then an outside摆 step to reverse direction.", "Open both forearms like branching antlers, reestablish the new inside palm toward center, and continue walking on the opposite side."], "end": "Finish walking the circle in the reversed direction with inside antler hand extended, outside palm guarding, crown lifted, and steps quiet."}, "Bear|BaGua Zhang": {"type": "three", "start": "Take a broad, low circle-walking stance with knees aligned over the toes. Turn inward with both forearms rounded as though carrying a heavy sphere.", "seq": ["Walk the circle with deliberate flat steps and an even body height; let the upper back remain broad.", "Sink into the support leg and draw both rounded forearms toward the ribs.", "Bear Back Change:扣 step inward, turn the back through the center of the circle, and sweep both forearms outward from the upper back.", "Complete the摆 step, settle the new lead leg, reform the carrying sphere, and resume the circle in the opposite direction."], "end": "Finish low and rooted on the circle with rounded forearms, torso turned inward, and weight settled through the whole feet."}, "Monkey|BaGua Zhang": {"type": "three", "start": "Stand lightly on the circle with a compact stance, torso turned inward, lead palm at chest height and rear hand near the ribs.", "seq": ["Walk three quick but quiet steps, keeping the knees springy and the head level.", "On the next step, withdraw the lead palm and gather into the rear leg.", "Monkey Redirect: place a short扣 step, duck the center slightly, thread the rear palm forward, and pivot sharply through the waist.", "Complete the摆 step to the new direction, lift the center back to walking height, exchange palms, and continue around the circle."], "end": "Finish in agile circle-walking posture with inside palm forward, outside hand gathered, and weight ready to change."}, "Crane|BaGua Zhang": {"type": "three", "start": "Stand upright on the circle with a narrow stance. Inside arm is softly raised, outside palm low near the hip, shoulders released.", "seq": ["Walk the circle at an even height with silent heel-to-toe placements and a clear inward torso turn.", "Settle fully into the inside leg and let the outside foot become empty.", "Crane Wing Change:扣 step inward as the high arm lowers and the low arm rises; complete the turn with a摆 step while the arms open into vertical wing separation.", "Place the empty foot, exchange high and low arms, and resume walking in the opposite direction."], "end": "Finish tall and balanced with one palm high, one low, torso inward, and steps light."}, "Dragon|BaGua Zhang": {"type": "three", "start": "Stand on the circle with knees bent, torso strongly turned inward, inside palm high and forward, outside palm low near the ribs.", "seq": ["Walk four mud steps while maintaining a continuous spiral from feet through waist to palms.", "Coil deeper on the support leg and draw the outside palm upward along the centerline.", "Dragon Coil Change:扣 step inward, thread the rising palm over the crown as the other sinks, then unwind through a wide摆 step to reverse direction.", "Extend the new inside palm toward center, gather the outside hand, and continue the spiral walk."], "end": "Finish in the new direction with inside palm extended, outside palm low, hips settled, and the torso spiraled inward."}, "Snake|BaGua Zhang": {"type": "three", "start": "Stand in a narrow circle stance with torso turned inward. Inside palm threads forward at lower-chest height; outside palm guards beneath the elbow.", "seq": ["Walk the circle with overlapping mud steps, keeping the knees close and the spine long.", "Gather the inside elbow toward the ribs while the outside palm threads forward beneath it.", "Snake Threading Change:扣 step inward, wrap the two forearms around the centerline, then pivot through a摆 step as the upper hand threads out along the new direction.", "Uncoil the waist, reestablish the inside threading palm, and resume the walk without lifting the center."], "end": "Finish narrow and coiled with one palm threaded toward center, the other guarding, and feet connected to the circle."}, "Mantis|BaGua Zhang": {"type": "three", "start": "Stand on the circle in a compact stance. Inside hand forms a relaxed hook at chest height; outside palm guards the sternum.", "seq": ["Walk four short quiet steps while maintaining the hook toward the center.", "Gather the outside palm to the ribs and draw the inside hook inward across the centerline.", "Mantis Catch Change:扣 step, hook outward with the lead hand, thread the rear forearm forward beneath it, then摆 step to reverse direction.", "Withdraw both arms to compact guard, form the new inside hook, and continue circle walking."], "end": "Finish compactly with inside hook extended, outside hand guarding, shoulders down, and steps precise."}, "Horse|BaGua Zhang": {"type": "three", "start": "Stand on the circle with a longer walking stance, torso turned inward, inside palm forward and outside palm near the ribs.", "seq": ["Walk six sustained mud steps with even cadence and no rise or fall of the pelvis.", "Lengthen the next step, gather the outside palm, and shift fully into the lead leg.", "Horse Crossing Change:扣 step deeply, swing the rear leg through a broad摆 step, and open both palms horizontally as the waist turns.", "Bring the trailing foot onto the new circle, establish the new inside palm, and continue with the same steady pace."], "end": "Finish traveling in the opposite direction with a long connected stance, torso inward, and palms open."}, "Lion|BaGua Zhang": {"type": "three", "start": "Stand low on the circle with feet wider than usual, torso turned inward, both palms rounded before the chest as interlocking guards.", "seq": ["Walk the circle with heavy, continuous steps while keeping the crown lifted.", "Compress the palms toward one another and sink into the support leg.", "Lion Interlocking Change:扣 step inward, cross the forearms before the chest, then摆 step and open both palms powerfully to opposite diagonals.", "Settle into the new direction, reform the rounded guard, and resume the walk without standing up."], "end": "Finish low and stable with inside palm toward center, outside palm supporting, and whole-body connection intact."}, "Eagle|BaGua Zhang": {"type": "three", "start": "Stand on the circle with inside palm slightly high, outside hand near the inside elbow, fingers naturally curved and elbows heavy.", "seq": ["Walk four quiet steps, maintaining an inward turn and broad upper back.", "Raise both hands slightly as the body gathers into the support leg.", "Eagle Seizing Change:扣 step, close both hands toward the centerline, then split the forearms downward and outward as the摆 step reverses direction.", "Rise only enough to restore walking height, extend the new inside palm, and continue around the circle."], "end": "Finish in the reversed direction with inside palm focused toward center, outside hand gathered, spine long, and steps rooted."}, "Unicorn|BaGua Zhang": {"type": "three", "start": "Stand on the circle with a centered narrow stance. Inside palm is upright before the chest; outside palm rests low near the abdomen.", "seq": ["Walk four mud steps while keeping the torso inward and pelvis level.", "Gather both palms toward the lower center and coil into the support leg.", "Unicorn Reversing Change:扣 step, turn the waist back through the incoming line as the low palm spirals upward and the high palm anchors down.", "Complete the摆 step, settle the new lead leg, exchange palm levels, and resume walking in the opposite direction."], "end": "Finish upright and centered with one palm high, one low, torso inward, and weight settled."}, "Rooster|BaGua Zhang": {"type": "three", "start": "Stand upright on the circle with one palm high before the face and the other low beside the hip, elbows relaxed.", "seq": ["Walk the circle with crisp, quiet steps and a level crown.", "Settle into the inside leg and lift the outside knee only as high as balance remains clear.", "Rooster Lying-Step Change: place the lifted foot into a low扣 step as the high elbow folds inward and the low palm rises; pivot through a摆 step to reverse direction.", "Reestablish the high-low palm split and resume circle walking on the opposite side."], "end": "Finish vertically aligned with one palm high, one low, knees soft, and gaze toward the circle center."}, "Turtle|BaGua Zhang": {"type": "three", "start": "Stand on the circle with knees deeply soft and both forearms rounded before the ribs, palms inward as a protective shell.", "seq": ["Walk slowly with flat, deliberate steps and no visible sway of the upper body.", "Sink into the support leg, expand the upper back, and draw the elbows inward.", "Turtle Shell Change:扣 step while carrying the rounded guard across the center; pivot through the waist and perform a small摆 step without opening the elbows wide.", "Complete the turn, extend the new inside forearm as a rounded shield, gather the outside palm, and resume walking."], "end": "Finish protected and rooted with rounded inside forearm toward center, outside palm guarding the ribs, and breath calm."}}}; const animals=D.animals,practices=D.practices,records=D.records,days=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];let start=0,selectedAnimal='Tiger',selectedPractice='Tai Chi Chuan';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function renderBody(r){if(r.type==='tai')return '<div class="tai-library">'+r.items.map(x=>`<div class="field"><b>${esc(x.name).toUpperCase()}</b><strong>Quality: ${esc(x.q)}</strong><p><b>STANCE</b>${esc(x.stance)}</p><p><b>FEET & WEIGHT</b>${esc(x.feet)}</p><p><b>ARM POSITIONS</b>${esc(x.arms)}</p><p><b>HAND SHAPE / ORIENTATION</b>${esc(x.hands)}</p><p><b>BODY ALIGNMENT</b>${esc(x.align)}</p><p><b>GAZE</b>${esc(x.gaze)}</p><p><b>DISTINCTIVE QUALITY</b>${esc(x.quality)}</p></div>`).join('')+'</div>';return `<div class="fields"><div class="field"><b>STARTING POSITION</b><p>${esc(r.start)}</p></div><div class="field"><b>EXACT MOVEMENT SEQUENCE</b><ol>${r.seq.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div><div class="field"><b>ENDING POSITION</b><p>${esc(r.end)}</p></div></div>`}
function renderRecord(){const a=animals.find(x=>x.n===selectedAnimal),r=records[a.n+'|'+selectedPractice];document.querySelector('#record').innerHTML=`<small>PRACTICE RECORD</small><h3>${a.n} · ${selectedPractice}</h3><p>${a.p} · ${a.e}</p>${r?renderBody(r):'<p>Record pending.</p>'}<p class="notice">Tai Chi posture libraries do not prescribe transitions. Tiger, Shark, and Owl preserve their established identities. Traditional Xingyi and Bagua animal names vary by lineage; Floating Rhythm records for nontraditional animals are designed movement translations, not lineage claims.</p>`}
function renderWeek(){const w=document.querySelector('#week');w.innerHTML='';days.forEach((d,i)=>{const a=animals[(start+i)%animals.length],card=document.createElement('article');card.className='day';card.innerHTML=`<div class="dow">${d}</div><h2>${a.n}</h2><p class="element">${a.e}</p><p class="principle">${a.p}</p><div>${practices.map(p=>`<button type="button" class="practice" data-a="${a.n}" data-p="${p}">${p}</button>`).join('')}</div><label class="notes-label" for="note-${i}">Notes</label><textarea class="notes" id="note-${i}" placeholder="Movement discoveries, transition ideas, observations…"></textarea>`;w.appendChild(card)});w.querySelectorAll('.practice').forEach(b=>b.addEventListener('click',()=>{selectedAnimal=b.dataset.a;selectedPractice=b.dataset.p;w.querySelectorAll('.practice').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderRecord();document.querySelector('#record').scrollIntoView({behavior:'smooth',block:'nearest'})}))}
function renderAnimals(){const x=document.querySelector('#animals');animals.forEach((a,i)=>{const b=document.createElement('button');b.type='button';b.className='animal-pill'+(i===0?' active':'');b.textContent=a.n+' · '+a.e;b.addEventListener('click',()=>{start=i;selectedAnimal=a.n;selectedPractice='Tai Chi Chuan';x.querySelectorAll('button').forEach(y=>y.classList.remove('active'));b.classList.add('active');renderWeek();renderRecord()});x.appendChild(b)})}renderAnimals();renderWeek();renderRecord();
</script></body></html>
