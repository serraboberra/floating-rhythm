</style></head><body><header class="hero"><div class="hero-row"><div class="brand"><h1>Floating Rhythm</h1><em>Your body knows the way.</em><p>A living practice calendar organized by animal, movement, rest, and return.</p></div><div class="cycle"><strong>16 Animals<br>One Rhythm<br>A Fuller You</strong></div><div class="night"><div class="moon">☾</div><strong>DAY · NIGHT · RETURN</strong><p><em>Harmony is not a fixed state,<br>but a living rhythm.</em></p></div></div></header><main class="wrap"><div class="toolbar" id="animals"></div><section class="week" id="week"></section><section class="record" id="record" aria-live="polite"></section></main><footer class="foot">Move well · Live fully · Return often</footer><script>

right structure through the waist turn.", "gaze": "Follow the turning center.", "quality": "Receive rather than oppose."}, {"name": "Press", "q": "Yin becoming Yang", "stance": "Stable bow stance.", "feet": "Settle toward the forward leg while retaining rear-foot connection.", "arms": "Rounded arms collect toward the front of the center.", "hands": "Relaxed hands.", "align": "Upright and integrated; do not reach from the shoulders.", "gaze": "Forward.", "quality": "Contained expansion."}, {"name": "Push", "q": "Yang returning toward Yin", "stance": "Rooted bow stance.", "feet": "Controlled forward settling without leaning.", "arms": "Both arms express forward while connected to the torso.", "hands": "Open palms.", "align": "Vertical spine and released shoulders.", "gaze": "Forward.", "quality": "Power expressed without rigidity."}]}, "Tiger|Qi Gong": {"type": "three", "start": "Feet shoulder-width and parallel; knees soft, spine upright, shoulders lowered. Form defined Tiger Claws.", "seq": ["Raise the Tiger: draw the clawed hands upward above the head, then draw them down with controlled strength.", "Tiger Pounce: sink through the legs, bring the hands upward and forward, and extend into the pounce as the torso folds and unfolds in one wave.", "Claw and Stretch: gather toward center, then lengthen through claws, limbs and spine.", "Return: soften the claws and settle evenly into upright standing."], "end": "Feet grounded and parallel; knees soft, spine upright, arms relaxed, weight centered."}, "Tiger|Hsing-I": {"type": "three", "start": "Compact forward stance; knees flexed, kua released, spine long, shoulders settled; both hands in Tiger Mouth protecting the middle.", "seq": ["Contract through legs, hips, spine and arms without collapsing the chest.", "Rise from the gathered body, transmitting from the floor through back and shoulders.", "Advance diagonally, keeping rear-leg support.", "Double-Palm Tiger Pounce: both palms issue together, outward and slightly upward, with the step and body arriving as one.", "Regather to the center, settle the kua, then repeat on the opposite diagonal."], "end": "Compact connected stance; feet grounded, knees soft, kua settled, hands gathered in Tiger Mouth."}, "Tiger|BaGua Zhang": {"type": "three", "start": "Stand on an imagined circle; sink gently, lengthen the crown, turn the torso inward; inside palm extends toward center and outside hand stays near the torso.", "seq": ["Begin the circle walk along the circumference with the waist turned inward.", "Gather the Tiger: outside palm draws to the ribs as weight sinks slightly.", "Turn and open: waist and back rotate; gathered palm travels forward as the other draws back.", "Tiger Palm: settle and express the forward palm while rear palm supports the centerline.", "Coil back into the circle and resume walking; repeat on the opposite side."], "end": "Finish a circle step rooted and lengthened, torso toward center, inside palm extended and outside palm gathered."}, "Shark|Qi Gong": {"type": "three", "start": "Deep Water Wu Ji: feet under hips or slightly narrower, knees soft, pelvis neutral, spine long; feet pressurized while torso, ribs and shoulders dissolve; head floats slightly forward, gaze soft and wide, breath thin and continuous.", "seq": ["Body Wave: hinge softly at the knees and send a small wave ankles → sacrum → vertebrae → head; reverse it back to the ankles, continuously.", "Lateral Sensing: transfer fully left, then right, keeping the empty foot flat; develop the transfer into a continuous pendulum.", "Forward Pressure Walk: walk without rising out of density; pivot and return, then practice internally triggered changes of direction.", "Pectoral Rotation: arms at shoulder height, make synchronized figure-eights forward and reverse, then alternate the arms.", "Tail Fin Flick: free one side and initiate a small diagonal torque from the sacrum; let it travel through spine to opposite shoulder; alternate sides."], "end": "Return to dense neutral standing: feet pressurized, torso liquid, spine long, breath continuous, gaze wide."}, "Shark|BaGua Zhang": {"type": "three", "start": "Deep Water Entry: feet together, knees slightly bent; torso liquid, spine vertical; lead arm slightly forward, rear elbow by ribs, palms down at hip height; head slightly forward with soft wide gaze.", "seq": ["Enter the Current: Tail Fin Flick initiates the first circle step; each step is a lateral weight shift with the rear foot drawing level.", "Pivot: rear foot flick and sacrum torque redirect the body without breaking the lateral wave.", "Cutting Turn: rotate the body as one mass; lead arm sweeps outward while rear arm gathers; cross-step, circle the leg out, resume the wave.", "Cresting Rise: redirect the lateral wave vertically through the spine; rear arm threads upward, both hands rise, then return down the axis and resume the circle walk."], "end": "Re-enter the continuous circle walk with feet pressurized, torso liquid, palms low and the lateral wave restored."}, "Shark|Hsing-I": {"type": "three", "start": "San-ti-like compact stance adapted to Shark: lead foot forward, rear foot connected, knees soft; torso liquid but coherent; both palms low and forward like pectoral fins; head slightly forward, gaze wide.", "seq": ["Pressurize: settle through the feet without bracing the trunk.", "Wave-load: create a small ankle-to-sacrum-to-spine wave while maintaining forward intent.", "Advance: step straight through with no pause; rear foot follows to restore the base.", "Fin Split: lead palm drives forward while rear palm draws past the ribs, powered by sacral torque rather than shoulder reach.", "Tail Redirect: use a short diagonal sacrum flick to change the line, then immediately advance on the new line.", "Repeat left/right, keeping the pressure continuous rather than resetting between issues."], "end": "Settle in a compact forward stance, feet dense, spine long, shoulders dissolved, hands low and ready, breath continuous."}, "Shark|Tai Chi Chuan": {"type": "tai", "items": [{"name": "Commencement — Deep Water", "q": "Yin", "stance": "Parallel stance, feet under hips.", "feet": "Evenly weighted; knees soft.", "arms": "Arms float forward only as high as the shoulders can remain dissolved.", "hands": "Palms relaxed and slightly down.", "align": "Spine long, sacrum heavy, ribs unbraced.", "gaze": "Soft horizon gaze.", "quality": "Density without muscular heaviness."}, {"name": "Wave Hands Like Currents", "q": "Yin becoming Yang", "stance": "Comfortable side-to-side base.", "feet": "Transfer fully but smoothly from one leg to the other.", "arms": "Arms travel with the waist in broad horizontal arcs.", "hands": "Open palms, changing orientation with the turn.", "align": "Let lateral weight transfer move the torso; shoulders follow.", "gaze": "Wide and unfixed.", "quality": "Continuous lateral sensing."}, {"name": "Needle at Sea Bottom", "q": "Yin", "stance": "Narrowed stance with one leg substantially weighted.", "feet": "Sink into the supporting leg; empty the other without collapsing.", "arms": "One hand traces downward while the other supports near the center.", "hands": "Relaxed fingers, palm angled toward the floor.", "align": "Fold from the kua while keeping length through the spine.", "gaze": "Downward and forward without craning the neck.", "quality": "Descend into depth while retaining direction."}, {"name": "Fan Through the Back — Cresting Fin", "q": "Yang", "stance": "Forward bow stance.", "feet": "Front leg receives; rear foot remains connected.", "arms": "One arm rises as the other extends forward, opening the upper back.", "hands": "Open palms.", "align": "Lengthen through crown and upper back without lifting the ribs.", "gaze": "Forward beneath the raised arm.", "quality": "The submerged wave crests without losing its root."}]}, "Owl|Qi Gong": {"type": "three", "start": "Moonrise Wu Ji: feet shoulder-width, pelvis sinks a few millimeters into a perch; elbows float slightly outward; eyes open with deliberately widened peripheral vision.", "seq": ["Cervical Circles: slow, pain-free head circles with shoulders still; never force range.", "Ear Listening: receive the soundscape without naming it; turn and tilt the head slowly while listening, then reopen the eyes and combine auditory and visual periphery.", "Silent Step Training: walk slowly in a circle, placing each foot as quietly as possible with flexed knees.", "Wing Expansion: arms extend to full wingspan, rotate palms up, close forward until fingertips nearly meet, then expand again with the breath.", "Moonlight Gaze: gently incline the head upward within comfortable range; add broad wing expansion while keeping chest soft."], "end": "Return to Moonrise Wu Ji with a quiet perch, soft throat, wide visual field and silent breath."}, "Owl|BaGua Zhang": {"type": "three", "start": "Moonrise Standing: feet shoulder-width, weight even; chest soft, arms rounded at shoulder height as if holding the moon; gaze wide and receiving.", "seq": ["Silent Circle Walk: head glides first, body follows; lift each foot vertically and place it softly, transferring weight gradually while upper body remains quiet.", "Silent Pivot: with weight settled, orient the head first within comfortable range, then let rear foot and body follow; return to the circle.", "Silent Drop: descend as one upright unit without preparatory sway, gather both palms inward, then rise quietly back to stepping.", "Moon Gaze Palm: from low guard, one palm arcs upward as the other draws to the hip; alternate sides.", "Wing Wrap and Feather Float: open broadly, gather inward, then use a 45-degree body turn and soft arm redirection to preserve the Owl’s yielding quality.", "Night Vision Spiral: walk slowly with downcast gaze, relying on periphery and proprioception, then return to wide-field gaze."], "end": "Finish in Moonrise Standing: centered, silent, arms rounded, gaze wide and receptive."}, "Owl|Hsing-I": {"type": "three", "star
