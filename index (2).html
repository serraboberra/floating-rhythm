<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Floating Rhythm</title>
<style>
:root{--ink:#12384a;--sage:#547768;--paper:#f7f4eb;--cream:#fffdf7;--gold:#d6ac65;--line:#d8d6cc;--night:#213f58;--mist:#e9f0e7}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font:16px/1.45 Georgia,serif;background:linear-gradient(110deg,#f8f5e9 0%,#f1ead7 48%,#e5eaf0 100%)}
button,textarea{font:inherit;color:inherit}.hero{padding:32px clamp(20px,5vw,64px);background:linear-gradient(105deg,#eef1df 0%,#ffe1a9 42%,#7891a8 70%,#213d5c 100%);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;inset:auto 0 0;height:34%;background:linear-gradient(165deg,transparent 15%,rgba(65,98,81,.32) 16% 21%,transparent 22%),linear-gradient(195deg,transparent 28%,rgba(36,72,69,.4) 29% 36%,transparent 37%);opacity:.65}.hero-row{position:relative;z-index:1;display:grid;grid-template-columns:1.2fr .8fr .8fr;gap:24px;align-items:center}.brand h1{font-size:clamp(42px,6vw,78px);font-weight:500;margin:0}.brand em{font-size:24px}.brand p{font-family:system-ui,sans-serif;max-width:360px}.cycle{text-align:center;background:rgba(255,255,255,.48);border:1px solid rgba(255,255,255,.7);border-radius:50%;aspect-ratio:1;display:grid;place-content:center;padding:24px}.cycle strong{font-size:21px}.night{text-align:center;color:#fff}.night .moon{font-size:46px}.wrap{max-width:1500px;margin:auto;padding:26px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}.animal-pill{border:1px solid #bfc9c0;background:#faf8f0;border-radius:999px;padding:8px 13px;cursor:pointer}.animal-pill.active{background:var(--sage);color:white;border-color:var(--sage)}.week{display:grid;grid-template-columns:repeat(7,minmax(190px,1fr));gap:14px;overflow-x:auto;padding-bottom:8px}.day{min-width:190px;background:rgba(255,253,247,.92);border:1px solid var(--line);border-radius:20px;padding:17px;box-shadow:0 8px 25px rgba(32,50,45,.06);display:flex;flex-direction:column;min-height:510px}.day .dow{font:700 12px/1.2 system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#60746d}.day h2{font-size:28px;margin:8px 0 0}.element{color:#8b6d35;margin:0 0 6px}.principle{font-style:italic;min-height:48px}.practice{width:100%;text-align:left;border:1px solid #d8d2c4;background:#fffdf8;border-radius:12px;padding:11px;margin:5px 0;cursor:pointer}.practice:hover,.practice.active{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}.notes-label{font:700 12px system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;margin:18px 0 6px}.notes{margin-top:auto;resize:vertical;min-height:92px;border:1px solid #d8d2c4;border-radius:12px;background:#faf8f0;padding:10px}.record{margin-top:24px;background:var(--night);color:#fff;border-radius:24px;padding:24px}.record h3{font-size:31px;margin:4px 0}.record small{font:700 12px system-ui,sans-serif;letter-spacing:.15em;color:#e8cf9c}.fields{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}.field{border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:15px;background:rgba(255,255,255,.05)}.field b{display:block;color:#f1cf86;font:700 12px system-ui,sans-serif;letter-spacing:.07em;margin-bottom:8px}.hint{opacity:.78}.foot{text-align:center;padding:25px;font-style:italic}@media(max-width:900px){.hero-row{grid-template-columns:1fr}.cycle{max-width:260px;margin:auto}.night{text-align:left}.fields{grid-template-columns:1fr 1fr}}@media(max-width:520px){.fields{grid-template-columns:1fr}.wrap{padding:15px}}
</style>
</head>
<body>
<header class="hero"><div class="hero-row"><div class="brand"><h1>Floating Rhythm</h1><em>Your body knows the way.</em><p>A living practice calendar organized by animal, movement, rest, and return.</p></div><div class="cycle"><strong>16 Animals<br>One Rhythm<br>A Fuller You</strong></div><div class="night"><div class="moon">☾</div><strong>DAY · NIGHT · RETURN</strong><p><em>Harmony is not a fixed state,<br>but a living rhythm.</em></p></div></div></header>
<main class="wrap"><div class="toolbar" id="animals" aria-label="16 animal cycle"></div><section class="week" id="week"></section><section class="record" id="record" aria-live="polite"></section></main><footer class="foot">Move well · Live fully · Return often</footer>
<script>
const animals=[
 {n:'Tiger',e:'Wood',p:'Root · gather · release'}, {n:'Deer',e:'Water',p:'Listen · soften · flow'}, {n:'Bear',e:'Earth',p:'Settle · support · carry'}, {n:'Monkey',e:'Fire',p:'Adapt · spark · redirect'}, {n:'Crane',e:'Metal',p:'Clarity · balance · grace'},
 {n:'Dragon',e:'',p:'Spiral · rise · transform'}, {n:'Shark',e:'',p:'Sense · track · continue'}, {n:'Snake',e:'',p:'Coil · extend · gather'}, {n:'Mantis',e:'',p:'Attend · intercept · connect'}, {n:'Horse',e:'',p:'Open · travel · sustain'}, {n:'Leopard',e:'',p:'Gather · spring · settle'}, {n:'Eagle',e:'',p:'Expand · focus · descend'}, {n:'Owl',e:'',p:'Turn · perceive · return'}, {n:'Unicorn',e:'',p:'Unify · refine · express'}, {n:'Rooster',e:'',p:'Rise · align · announce'}, {n:'Turtle',e:'',p:'Protect · conserve · endure'}
];
const practices=['Qi Gong','BaGua Zhang','Hsing-I','Tai Chi Chuan'];
const days=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
let start=0, selectedPractice='Qi Gong', selectedAnimal='Tiger';
const movementData={}; // Insert the authored animal-specific movement records here. The interface intentionally does not invent replacements.
function placeholder(animal,practice){
 if(practice==='Tai Chi Chuan') return `<p class="hint">Tai Chi Chuan will use the selected animal’s Yin/Yang posture library: Stance · Feet & Weight · Arm Positions · Hand Shape/Orientation · Body Alignment · Gaze · Distinctive Quality. Transitions remain yours to author.</p>`;
 return `<div class="fields"><div class="field"><b>STARTING POSITION</b><span class="hint">Authored ${animal} ${practice} record goes here.</span></div><div class="field"><b>EXACT MOVEMENT SEQUENCE</b><span class="hint">No generic fallback movement is inserted.</span></div><div class="field"><b>ENDING POSITION</b><span class="hint">Defined by the literal movement record.</span></div><div class="field"><b>NEXT MOVEMENT BEGINS HERE</b><span class="hint">Preserve the exact handoff into the next movement.</span></div></div>`;
}
function renderRecord(){const a=animals.find(x=>x.n===selectedAnimal);const key=a.n+'|'+selectedPractice;document.querySelector('#record').innerHTML=`<small>PRACTICE RECORD</small><h3>${a.n} · ${selectedPractice}</h3><p>${a.p}${a.e?' · '+a.e:''}</p>${movementData[key]||placeholder(a.n,selectedPractice)}`}
function renderWeek(){const w=document.querySelector('#week');w.innerHTML='';days.forEach((d,i)=>{const a=animals[(start+i)%animals.length],card=document.createElement('article');card.className='day';card.innerHTML=`<div class="dow">${d}</div><h2>${a.n}</h2><p class="element">${a.e||'Expanded cycle'}</p><p class="principle">${a.p}</p><div>${practices.map(p=>`<button type="button" class="practice" data-a="${a.n}" data-p="${p}">${p}</button>`).join('')}</div><label class="notes-label" for="note-${i}">Notes</label><textarea class="notes" id="note-${i}" placeholder="Movement discoveries, transition ideas, observations…"></textarea>`;w.appendChild(card)});w.querySelectorAll('.practice').forEach(b=>b.addEventListener('click',()=>{selectedAnimal=b.dataset.a;selectedPractice=b.dataset.p;document.querySelectorAll('.practice').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderRecord();document.querySelector('#record').scrollIntoView({behavior:'smooth',block:'nearest'})}))}
function renderAnimals(){const x=document.querySelector('#animals');animals.forEach((a,i)=>{const b=document.createElement('button');b.type='button';b.className='animal-pill'+(i===0?' active':'');b.textContent=a.n+(a.e?' · '+a.e:'');b.addEventListener('click',()=>{start=i;selectedAnimal=a.n;x.querySelectorAll('button').forEach(y=>y.classList.remove('active'));b.classList.add('active');renderWeek();renderRecord()});x.appendChild(b)})}
renderAnimals();renderWeek();renderRecord();
</script>
</body></html>
